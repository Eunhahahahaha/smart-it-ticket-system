version: '3.8'

services:
  # 1. MySQL 資料庫 (存放各微服務的獨立 Schema)
  mysql:
    image: mysql:8.0
    container_name: it-ticket-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 掛載初始化腳本，自動建立 ticket_db, kb_db, dashboard_db, keycloak_db
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-net

  # 2. RabbitMQ 訊息佇列 (負責異步通知、CQRS 數據同步、DLQ 死信處理)
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: it-ticket-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    ports:
      - "5672:5672"   # AMQP 程式連線端口
      - "15672:15672" # Web 管理介面端口 (帳號密碼見 .env)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-net

  # 3. Chroma 向量資料庫 (負責儲存知識庫文章與歷史工單的 Embedding 向量)
  chroma:
    image: chromadb/chroma:0.5.5
    container_name: it-ticket-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticket-net

  # 4. Keycloak 身分認證中心 (負責 OAuth2/OIDC 登入、發放 JWT Token、第三方登入)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: it-ticket-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak_db
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8180:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ticket-net

volumes:
  mysql_data:
  rabbitmq_data:
  chroma_data:

networks:
  ticket-net:
    driver: bridge